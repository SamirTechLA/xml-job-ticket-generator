services:
  # PostgreSQL database instance
  - type: db
    name: easy-ov-db
    ipAllowList: [] # Allow only internal access from the web service for security

  # Node.js Express service
  - type: web
    name: easy-ov-jobticket
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Generates a secure random secret key automatically
      - key: DB_HOST
        fromDatabase:
          name: easy-ov-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: easy-ov-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: easy-ov-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: easy-ov-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: easy-ov-db
          property: password
