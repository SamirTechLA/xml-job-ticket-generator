databases:
  - name: easy-ov-db
    plan: free # Use Render's free tier database plan
    ipAllowList: [] # Strict security: block public IP access, allow only internal services

services:
  - type: web
    name: easy-ov-jobticket
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Generates a secure random JWT signature key automatically
      - key: DATABASE_URL
        fromDatabase:
          name: easy-ov-db
          property: connectionString # Passes the secure internal PostgreSQL URL directly
